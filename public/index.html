<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>URL Shortener</title>
</head>
<body>
  <h1>Shorten a URL</h1>
  <form id="form">
    <input id="url" type="url" placeholder="https://example.com" required style="width:300px"/>
    <button>Shorten</button>
  </form>
  <p id="result"></p>
  <script>
    document.getElementById('form').onsubmit = async e => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      const res = await fetch('/shorten', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({url})
      });
      const data = await res.json();
      document.getElementById('result').innerHTML =
        data.shortCode
          ? `Short URL: <a href="/${data.shortCode}">/${data.shortCode}</a>`
          : `<em>${data.message}</em>`;
    };
  </script>
</body>
</html>
