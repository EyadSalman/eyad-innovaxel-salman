<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>URL Shortener – Full CRUD UI</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    section { margin-bottom: 30px; }
    input { width: 300px; padding: 5px; }
    button { margin-left: 5px; }
    .result { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>URL Shortener Service</h1>

  <!-- Create -->
  <section>
    <h2>Create (Shorten)</h2>
    <form id="createForm">
      <input id="createUrl" type="url" placeholder="https://example.com" required />
      <button type="submit">Shorten</button>
    </form>
    <div id="createResult" class="result"></div>
  </section>

  <!-- Read / Stats / Update / Delete -->
  <section>
    <h2>Manage Existing Short URL</h2>
    <form id="manageForm">
      <input id="manageCode" type="text" placeholder="Enter shortCode (e.g. a1b2c3)" required />
      <button type="button" id="fetchBtn">Fetch Original</button>
      <button type="button" id="statsBtn">View Stats</button>
      <button type="button" id="updateBtn">Update URL</button>
      <button type="button" id="deleteBtn">Delete</button>
    </form>
    <div id="manageResult" class="result"></div>
  </section>

  <script>
    const createForm = document.getElementById('createForm');
    const createUrl = document.getElementById('createUrl');
    const createResult = document.getElementById('createResult');

    const manageForm = document.getElementById('manageForm');
    const manageCode = document.getElementById('manageCode');
    const manageResult = document.getElementById('manageResult');
    const fetchBtn = document.getElementById('fetchBtn');
    const statsBtn = document.getElementById('statsBtn');
    const updateBtn = document.getElementById('updateBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    // Create (Shorten)
    createForm.onsubmit = async e => {
      e.preventDefault();
      createResult.textContent = 'Working…';
      const longUrl = createUrl.value;
      const res = await fetch('/shorten', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({url: longUrl})
      });
      const data = await res.json();
      if (!res.ok) {
        createResult.textContent = 'Error: ' + data.message;
        return;
      }
      const link = `${location.origin}/${data.shortCode}`;
      createResult.innerHTML = `
        Shortened! <a href="${link}" target="_blank">${link}</a>
        <br><em>shortCode:</em> ${data.shortCode}
      `;
      createUrl.value = '';
    };

    // Fetch Original (Read)
    fetchBtn.onclick = async () => {
      manageResult.textContent = 'Fetching…';
      const code = manageCode.value.trim();
      if (!code) return;
      const res = await fetch(`/shorten/${code}`);
      if (res.status === 404) {
        manageResult.textContent = 'Not found';
        return;
      }
      const data = await res.json();
      manageResult.innerHTML = `
        <strong>Original URL:</strong>
        <a href="${data.url}" target="_blank">${data.url}</a>
      `;
    };

    // View Stats
    statsBtn.onclick = async () => {
      manageResult.textContent = 'Loading stats…';
      const code = manageCode.value.trim();
      if (!code) return;
      const res = await fetch(`/shorten/${code}/stats`);
      if (res.status === 404) {
        manageResult.textContent = 'Not found';
        return;
      }
      const data = await res.json();
      manageResult.textContent = `Accessed ${data.accessCount} time(s)`;
    };

    // Update
    updateBtn.onclick = async () => {
      const code = manageCode.value.trim();
      if (!code) return;
      const newUrl = prompt('Enter the new long URL:');
      if (!newUrl) return;
      manageResult.textContent = 'Updating…';
      const res = await fetch(`/shorten/${code}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({url: newUrl})
      });
      const data = await res.json();
      if (!res.ok) {
        manageResult.textContent = 'Error: ' + data.message;
        return;
      }
      manageResult.innerHTML = `
        <strong>Updated!</strong> Now points to
        <a href="${data.url}" target="_blank">${data.url}</a>
      `;
    };

    // Delete
    deleteBtn.onclick = async () => {
      const code = manageCode.value.trim();
      if (!code) return;
      if (!confirm(`Delete shortCode "${code}"?`)) return;
      manageResult.textContent = 'Deleting…';
      const res = await fetch(`/shorten/${code}`, { method: 'DELETE' });
      if (res.status === 204) {
        manageResult.textContent = `Deleted "${code}"`;
        manageCode.value = '';
      } else {
        const data = await res.json();
        manageResult.textContent = 'Error: ' + data.message;
      }
    };
  </script>
</body>
</html>
